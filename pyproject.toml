[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wasp"
version = "0.1.0"
description = "Weakly Aligned Spatiotemporal Pairs for fetal brain MRI-ultrasound learning"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "torch"]

[project.optional-dependencies]
preprocess = ["SimpleITK", "opencv-python", "Pillow", "monai"]

[tool.setuptools]
packages = ["wasp"]
